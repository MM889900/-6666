<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Stream - HD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(30, 30, 30, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 90%;
            width: 400px;
            border: 1px solid #333;
            position: relative;
        }
        .badge {
            background: #ff0055;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse 2s infinite;
        }
        h1 {
            font-size: 22px;
            margin: 20px 0 10px;
            color: #fff;
        }
        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(90deg, #ff0055, #ff0000);
            color: white;
            border: none;
            padding: 15px 0;
            width: 100%;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
        .online-count {
            color: #00ff00;
            font-weight: bold;
        }

        /* 加载动画遮罩 */
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #ff0055;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">LIVE NOW</div>
    <!-- 这里可以换成一张美女图的 URL -->
    <div style="width:80px; height:80px; background:#333; border-radius:50%; margin:20px auto; overflow:hidden;">
        <img src="https://via.placeholder.com/80/ff0055/ffffff?text=LIVE" alt="Avatar" style="width:100%; height:100%;">
    </div>
    
    <h1>Exclusive Private Show</h1>
    <p>She is waiting for you to join.</p>
    
    <button class="btn" id="playBtn" onclick="startStream()">▶ WATCH FREE STREAM</button>
    
    <div class="status">
        <span class="online-count" id="count">12,450</span> Users Online
    </div>
</div>

<!-- 加载遮罩 -->
<div id="loader">
    <div class="spinner"></div>
    <div id="loaderText">Validating Browser...</div>
</div>

<script>
    // *** 在这里填入你的 CPA 链接 ***
    const CPA_LINK = "https://d1bi3o2pwkkxw0.cloudfront.net/bx/pornhub";

    function startStream() {
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const btn = document.getElementById('playBtn');

        // 隐藏按钮，防止重复点击
        btn.style.display = 'none';
        loader.style.display = 'flex';

        // 步骤 1: 检查浏览器
        setTimeout(() => {
            loaderText.innerText = "Checking Device...";
        }, 1000);

        // 步骤 2: 连接服务器
        setTimeout(() => {
            loaderText.innerText = "Connecting to Server...";
        }, 2500);

        // 步骤 3: 跳转
        setTimeout(() => {
            window.location.href = CPA_LINK;
        }, 4000);
    }

    // 在线人数随机跳动，增加真实感
    setInterval(() => {
        const el = document.getElementById('count');
        let current = parseInt(el.innerText.replace(/,/g, ''));
        // 随机加减 100 到 500 之间的人
        let change = Math.floor(Math.random() * 400) - 200; 
        let newCount = current + change;
        if(newCount < 10000) newCount = 10000; // 保底人数
        el.innerText = newCount.toLocaleString();
    }, 3000);
</script>

</body>
</html>
